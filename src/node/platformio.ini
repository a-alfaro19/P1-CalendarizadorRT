; Firmware de los nodos del calendarizador de tiempo real.
; El nucleo portable vive en sched/ y se prueba en PC con el entorno native.
;
; Estructura del repo: el proyecto PlatformIO es src/node/. Cada subcarpeta
; (sched, calib, medicion, ut) es una biblioteca; node.cpp es el programa de
; la placa y las pruebas Unity estan en tests/test_*/ en la raiz del repo.

[platformio]
default_envs = native
src_dir = .
lib_dir = .
test_dir = ../../tests
; La compilacion va a .pio/ en la raiz del repo, fuera de src/: el Makefile del
; host compila todo src/**/*.c y no debe ver los archivos de PlatformIO.
workspace_dir = ../../.pio

[env]
test_framework = unity
build_flags = -Wall -Wextra
; Del programa solo se compila node.cpp; el resto entra como biblioteca.
build_src_filter = -<*> +<node.cpp>
extra_scripts = pre:omitir_tests_host.py

[env:native]
platform = native
build_flags = ${env.build_flags} -std=c11
; ut.c y la medicion solo tienen sentido en hardware.
lib_ignore = ut, medicion
; Las pruebas del host (tests/*_tests.c) son del Makefile, no de PlatformIO.
test_ignore = test_hw_*

; NodeMCU v3 (modulo ESP8266MOD, USB-serial CH340).
[env:esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
; En la placa solo corren las pruebas de hardware.
test_filter = test_hw_*

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
test_filter = test_hw_*
