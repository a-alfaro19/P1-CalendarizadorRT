; Firmware de los nodos del calendarizador de tiempo real.
; El nucleo portable vive en lib/sched y se prueba en PC con el entorno native.

[platformio]
default_envs = native
src_dir = ../..

[env]
test_framework = unity
build_flags =
    -Wall
    -Wextra
    -I../../include
    -I../../include/node/scheduler
    -I../../include/node/calibration
    -I../../include/node/measure
    -I../../include/node/ut
build_src_filter =
    +<src/node/node_driver.c>
    +<src/node/scheduler/*.c>
    +<src/node/calibration/*.c>
    +<src/protocol/*.c>

[env:native]
platform = native
build_flags = ${env.build_flags} -std=c11
; ut.c y la medicion solo tienen sentido en hardware.
lib_ignore = ut, medicion
test_ignore = test_hw_*

[env:esp32]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2026.04.50/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    ${env.build_src_filter}
    +<src/node/node.cpp>
    +<src/node/measure/*.cpp>
    +<src/node/ut/*.c>
; En la placa solo corren las pruebas de hardware.
test_filter = test_hw_*

[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
build_src_filter =
    ${env.build_src_filter}
    +<src/node/node.cpp>
    +<src/node/measure/*.cpp>
    +<src/node/ut/*.c>
test_filter = test_hw_*

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#5d4561a05e3b212660ac6fdd3fbfb328d1988aa1
board = pico
framework = arduino
board_build.core = earlephilhower
monitor_speed = 115200
build_src_filter =
    ${env.build_src_filter}
    +<src/node/node.cpp>
    +<src/node/measure/*.cpp>
    +<src/node/ut/*.c>
test_filter = test_hw_*
